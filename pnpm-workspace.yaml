---
packages:
  - frontend

minimumReleaseAge: 10080  # 7 days (in minutes)
minimumReleaseAgeExclude:
  - js-yaml@4.3.0 || 4.3.1
  - serialize-javascript@7.1.3
  - fast-uri@3.1.9
  - follow-redirects@1.16.2
  - minimatch@11.0.1
  - glob@14.0.2
  - path-scurry@3.0.0
  - "@isaacs/nonrecursive-glob-match@1.0.1"

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true

overrides:
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  glob@^11.1.0: '^14.0.2'
  serialize-javascript@<7.1.3: ^7.1.3
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1

auditConfig:
  ignoreGhsas:
    # TODO: remove after 7.11.26
    - GHSA-gcqx-w48m-w2h4  # deepmerge, no patch, build-time only via vite-plugin-pwa
