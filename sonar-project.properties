sonar.organization=entorb
sonar.projectKey=entorb_todo
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.version=3.11
sonar.sources=backend/app,backend/scripts,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=\
  backend/tests/**,\
  frontend/src/**/__tests__/**
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=\
  backend/app/gunicorn_conf.py,\
  backend/scripts/**,\
  frontend/src/main.ts,\
  frontend/src/plugins/**,\
  frontend/src/utils/clipboard.ts
# tests are scanned as tests, not sources
# client: auto-generated by @hey-api/openapi-ts, do not scan
sonar.exclusions=\
  frontend/src/**/__tests__/**,\
  frontend/src/client/**
